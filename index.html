<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Soccer Scene</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- ========================================================= -->
  <!-- COMPONENTE FIREWORK (FUNCIONA EM QUALQUER NAVEGADOR)       -->
  <!-- ========================================================= -->
  <script>
    AFRAME.registerComponent('firework', {
      schema: {
        delay: {type: 'number', default: 1000}
      },

      init: function () {
        const el = this.el;

        setTimeout(() => {
          for (let i = 0; i < 60; i++) {
            const spark = document.createElement("a-sphere");

            spark.setAttribute("position", el.getAttribute("position"));

            const colors = ["red", "yellow", "blue", "cyan", "green", "magenta", "orange", "white"];
            spark.setAttribute("color", colors[Math.floor(Math.random() * colors.length)]);
            spark.setAttribute("radius", 0.05);

            const dx = (Math.random() - 0.5) * 4;
            const dy = Math.random() * 4;
            const dz = (Math.random() - 0.5) * 4;

            spark.setAttribute("animation__move", {
              property: "position",
              to: `${dx} ${dy} ${dz}`,
              dur: 1200,
              easing: "easeOutQuad"
            });

            spark.setAttribute("animation__fade", {
              property: "scale",
              to: "0 0 0",
              dur: 1500,
              easing: "linear",
              delay: 1000
            });

            setTimeout(() => spark.remove(), 1700);

            el.sceneEl.appendChild(spark);
          }
        }, this.data.delay);
      }
    });
  </script>

</head>

<body>
  <a-scene background="color: #87CEEB">

    <a-plane
    position="0 -1.4 0"
    rotation="-90 0 0"
    width="200"
    height="200"
    color="#4CAF50">
  </a-plane>

    <!-- ===================================================== -->
    <!-- CÂMERA E ILUMINAÇÃO                                   -->
    <!-- ===================================================== -->
    <a-entity 
      camera
      position="0 20 40"
      wasd-controls="fly: true; acceleration: 80"
      look-controls>
    </a-entity>

    <a-entity light="type: ambient; intensity: 1"></a-entity>


    <!-- ===================================================== -->
    <!-- CAMPO DE FUTEBOL                                      -->
    <!-- ===================================================== -->
    <a-entity gltf-model="assets/model/soccer_field.glb" position="0 0 0"></a-entity>


    <!-- ===================================================== -->
    <!-- JOGADOR 1                                              -->
    <!-- ===================================================== -->
    <a-entity id="player1"
      gltf-model="assets/model/player.glb"
      position="0 0 24"
      auto-run
      move-to-mid="target: #ball; speed: 6; stopDistance: 2">
    </a-entity>


    <!-- ===================================================== -->
    <!-- BOLA                                                   -->
    <!-- ===================================================== -->
    <a-sphere id="ball"
      radius="0.75"
      position="0 0.2 0"
      color="#ffffff"
      shoot-ball="goal: 0 0 -28; speed: 20">
    </a-sphere>



    <!-- ===================================================== -->
    <!-- COMPONENTES A-FRAME PERSONALIZADOS                     -->
    <!-- ===================================================== -->

    <script>
    /* auto-run */
    AFRAME.registerComponent("auto-run", {
      init: function () {
        this.el.addEventListener("model-loaded", e => {
          const model = this.el.getObject3D("mesh");
          if (!model) return;

          const animations = model.animations || [];
          const clip = animations.find(a => a.name.includes("Run"));
          if (!clip) return;

          this.mixer = new THREE.AnimationMixer(model);
          this.action = this.mixer.clipAction(clip);
          this.action.play();
        });
      },

      tick: function (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });
    </script>


    <script>
    /* move-to-mid */
    AFRAME.registerComponent("move-to-mid", {
      schema: {
        target: {type: "selector"},
        stopDistance: {type: "number", default: 1.5},
        speed: {type: "number", default: 5},
        stopped: {type: "boolean", default: false}
      },

      tick: function (time, delta) {
        if (this.data.stopped) return;

        const player = this.el.object3D;
        const target = this.data.target.object3D;
        if (!target) return;

        const dir = new THREE.Vector3();
        dir.subVectors(target.position, player.position);

        const distance = dir.length();

        if (distance < this.data.stopDistance) {
          this.data.stopped = true;
          this.el.emit("arrived-mid");
          return;
        }

        dir.normalize();
        player.position.addScaledVector(dir, this.data.speed * (delta / 1000));
        player.rotation.y = Math.atan2(dir.x, dir.z);
      }
    });
    </script>


    <script>
    /* shoot-ball + fogos */
    AFRAME.registerComponent("shoot-ball", {
      schema: {
        goal: {type: "vec3"},
        speed: {type: "number", default: 12},
        active: {type: "boolean", default: false}
      },

      init: function () {
        document.querySelector("#player1").addEventListener("arrived-mid", () => {
          this.data.active = true;
        });
      },

      tick: function (time, delta) {
        if (!this.data.active) return;

        const ball = this.el.object3D;
        const goal = new THREE.Vector3(this.data.goal.x, this.data.goal.y, this.data.goal.z);

        const dir = new THREE.Vector3();
        dir.subVectors(goal, ball.position);

        // SE GOL ACONTECER → LIGA OS FOGOS
        if (dir.length() < 0.5) {
          this.data.active = false;

          // Fogos atrás do gol
          const scene = this.el.sceneEl;

          const fw1 = document.createElement("a-entity");
          fw1.setAttribute("firework", "delay: 100");
          fw1.setAttribute("position", "0 6 -32");
          scene.appendChild(fw1);

          const fw2 = document.createElement("a-entity");
          fw2.setAttribute("firework", "delay: 400");
          fw2.setAttribute("position", "-3 5 -30");
          scene.appendChild(fw2);

          const fw3 = document.createElement("a-entity");
          fw3.setAttribute("firework", "delay: 700");
          fw3.setAttribute("position", "3 5 -30");
          scene.appendChild(fw3);

          const fw4 = document.createElement("a-entity");
          fw4.setAttribute("firework", "delay: 800");
          fw4.setAttribute("position", "3 5 -30");
          scene.appendChild(fw4);


          return;
        }

        dir.normalize();
        ball.position.addScaledVector(dir, this.data.speed * (delta / 1000));
      }
    });
    </script>



    <!-- ===================================================== -->
    <!-- RUAS / MODELOS DECORATIVOS                            -->
    <!-- ===================================================== -->

    <!-- (Mantidos iguais ao seu código original) -->
    <a-entity gltf-model="assets/model/Street_Turn.glb" position="-25 0 -28"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-18 0 -28" rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-16 0 -28" rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-8 0 -28"  rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="0 0 -28"   rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="8 0 -28"   rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="16 0 -28"  rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="18 0 -28"  rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Turn.glb"  position="25 0 -28" rotation="0 270 0"></a-entity>

    <!-- LATERAIS -->
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-25 0 -20"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-25 0 -16"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-25 0 -8"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-25 0 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-25 0 8"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-25 0 16"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-25 0 18"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-25 0 20"></a-entity>

    <a-entity gltf-model="assets/model/Street_Straight.glb" position="25 0 -20"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="25 0 -16"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="25 0 -8"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="25 0 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="25 0 8"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="25 0 16"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="25 0 18"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="25 0 20"></a-entity>

    <!-- INFERIOR -->
    <a-entity gltf-model="assets/model/Street_Turn.glb" position="-25 0 28" rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-18 0 28" rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-16 0 28" rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="-8 0 28"  rotation="0 90 0"></a-entity>

    <a-entity gltf-model="assets/model/StreetT.glb" position="0 0 28" rotation="0 90 0"></a-entity>

    <a-entity gltf-model="assets/model/Street_Straight.glb" position="8 0 28"  rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="16 0 28" rotation="0 90 0"></a-entity>
    <a-entity gltf-model="assets/model/Street_Straight.glb" position="18 0 28" rotation="0 90 0"></a-entity>

    <a-entity gltf-model="assets/model/Street_Turn.glb" position="25 0 28" rotation="0 180 0"></a-entity>

  </a-scene>
</body>
